services:
  web:
    image: infinite-canvas-web:saas
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_API_URL: http://server:8080
    container_name: infinite-canvas-web
    ports:
      - "3000:3000"
    environment:
      SERVER_API_URL: http://server:8080
    depends_on:
      - server
    restart: unless-stopped

  server:
    image: infinite-canvas-server:saas
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: infinite-canvas-server
    environment:
      APP_ENV: production
      SERVER_ADDR: :8080
      DATABASE_URL: postgres://infinite_canvas:infinite_canvas@postgres:5432/infinite_canvas?sslmode=disable
      SESSION_COOKIE_NAME: ic_session
      SESSION_COOKIE_SECURE: "false"
      NEWAPI_BASE_URL: ${NEWAPI_BASE_URL:-}
      NEWAPI_TOKEN: ${NEWAPI_TOKEN:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_DIR: /app/data/media
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
    volumes:
      - ./data/media:/app/data/media
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: infinite-canvas-postgres
    environment:
      POSTGRES_DB: infinite_canvas
      POSTGRES_USER: infinite_canvas
      POSTGRES_PASSWORD: infinite_canvas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
