services:
  web:
    image: infinite-canvas-web:saas
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_API_URL: http://server:8080
    container_name: infinite-canvas-web
    ports:
      - "3005:3000"
    environment:
      SERVER_API_URL: http://server:8080
    depends_on:
      - server
    restart: unless-stopped

  server:
    image: infinite-canvas-server:saas
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: infinite-canvas-server
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      APP_ENV: production
      SERVER_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ic_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      MODEL_GATEWAY_PROVIDER: ${MODEL_GATEWAY_PROVIDER:-newapi}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-}
      MODEL_GATEWAY_INTERNAL_URL: ${MODEL_GATEWAY_INTERNAL_URL:-}
      MODEL_GATEWAY_TOKEN: ${MODEL_GATEWAY_TOKEN:-}
      MODEL_GATEWAY_TIMEOUT_SECONDS: ${MODEL_GATEWAY_TIMEOUT_SECONDS:-600}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-r2}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      LOCAL_STORAGE_DIR: /app/data/media
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-3}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-zh-CN}
    volumes:
      - ./data/media:/app/data/media
    restart: unless-stopped
